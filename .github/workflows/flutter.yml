name: Flutter CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test TrackMyGym
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Native Platform Runners
        run: |
          flutter create . --project-name track_my_gym --platforms=android,web --org com.trackmygym
          git checkout -- test/
          chmod +x android/gradlew || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: |
          set +e
          flutter analyze --no-fatal-warnings --no-fatal-infos > analyze.log 2>&1
          ANAL_EXIT=$?
          if [ $ANAL_EXIT -ne 0 ]; then
            PASTE_URL=$(curl -s --data-binary @analyze.log https://paste.rs)
            curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                 -X POST \
                 -d "{\"state\":\"error\",\"description\":\"$PASTE_URL\",\"context\":\"analyze-log\"}" \
                 "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"
            echo "Analyze failed with exit code $ANAL_EXIT: $PASTE_URL"
            exit $ANAL_EXIT
          fi

      - name: Run Unit & Widget Tests
        run: flutter test --no-pub

      - name: Build Android APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"
        run: |
          set +e
          flutter build apk --debug > build.log 2>&1
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            PASTE_URL=$(tail -n 80 build.log | curl -s --data-binary @- https://paste.rs)
            curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                 -X POST \
                 -d "{\"state\":\"error\",\"description\":\"$PASTE_URL\",\"context\":\"build-log\"}" \
                 "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"
            echo "Build failed with exit code $BUILD_EXIT: $PASTE_URL"
            exit $BUILD_EXIT
          fi

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrackMyGym-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
