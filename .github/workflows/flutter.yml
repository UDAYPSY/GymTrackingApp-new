name: Flutter CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test TrackMyGym
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Native Platform Runners
        run: |
          flutter create . --project-name track_my_gym --platforms=android,web --org com.trackmygym
          git checkout -- test/
          chmod +x android/gradlew || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee analyze.log || {
            echo "## Flutter Analyze Findings" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat analyze.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          }
        continue-on-error: true

      - name: Run Unit & Widget Tests
        run: flutter test --no-pub
        continue-on-error: true

      - name: Build Android APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log || {
            echo "## Android Build Failure Diagnostics" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrackMyGym-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload Build Log If Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log
